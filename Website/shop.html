<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="PHS DECA merch shop concept with animated product marquee."
		/>
		<link rel="icon" type="image/png" href="/images/logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<title>PHS DECA Shop</title>
		<style>
			:root {
				--bg: #0b0b0b;
				--blue: #185fa5;
				--blue-light: #378add;
				--text: #f1efe8;
				--muted: #8a8a86;
				--line: rgba(255, 255, 255, 0.12);
				--panel: rgba(255, 255, 255, 0.035);
				--display: "Archivo Black", Impact, sans-serif;
				--sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			html {
				background: var(--bg);
			}

			body {
				min-height: 100vh;
				margin: 0;
				background:
					radial-gradient(circle at 84% 12%, rgba(24, 95, 165, 0.2), transparent 22rem),
					linear-gradient(180deg, #0b0b0b 0%, #101010 54%, #0b0b0b 100%);
				color: var(--text);
				font-family: var(--sans);
				overflow-x: hidden;
			}

			body::before {
				position: fixed;
				inset: 0;
				z-index: 0;
				pointer-events: none;
				content: "";
				background-image: url("/images/noise.png");
				background-size: 220px;
				opacity: 0.035;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			button,
			input {
				font: inherit;
			}

			img {
				display: block;
				max-width: 100%;
			}

			.shop-page {
				position: relative;
				z-index: 1;
				min-height: 100vh;
			}

			.page-transition {
				position: fixed;
				inset: 0;
				z-index: 120;
				pointer-events: none;
				background: var(--blue);
				transform: translateY(100%);
			}

			body.is-transitioning {
				overflow: hidden;
			}

			.shop-nav {
				position: sticky;
				top: 0;
				z-index: 20;
				border-bottom: 1px solid var(--line);
				background: rgba(11, 11, 11, 0.78);
				backdrop-filter: blur(18px);
			}

			.nav-inner,
			.shop-intro,
			.shop-meta,
			.signup {
				width: min(1440px, calc(100% - clamp(2rem, 6vw, 5rem)));
				margin: 0 auto;
			}

			.nav-inner {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 2rem;
				padding: 1rem 0;
				font-size: 0.76rem;
				font-weight: 700;
				letter-spacing: 0.18em;
				text-transform: uppercase;
			}

			.nav-brand,
			.nav-links {
				display: flex;
				align-items: center;
			}

			.nav-brand {
				gap: 0.8rem;
			}

			.nav-mark {
				width: 3.15rem;
				height: 3.15rem;
				border: 0;
				border-radius: 0;
				object-fit: contain;
				background: transparent;
				box-shadow: none;
			}

			.nav-links {
				gap: clamp(1rem, 4vw, 2.4rem);
			}

			.nav-link {
				position: relative;
				display: inline-flex;
				padding: 0.3rem 0;
				color: rgba(241, 239, 232, 0.72);
				transition: color 180ms ease;
			}

			.nav-link::after {
				position: absolute;
				right: 0;
				bottom: 0;
				left: 0;
				height: 1px;
				content: "";
				background: var(--blue-light);
				transform: scaleX(0);
				transform-origin: right;
				transition: transform 220ms ease;
			}

			.nav-link:hover,
			.nav-link:focus-visible {
				color: var(--text);
			}

			.nav-link:hover::after,
			.nav-link:focus-visible::after {
				transform: scaleX(1);
				transform-origin: left;
			}

			.shop-intro {
				display: flex;
				align-items: flex-end;
				justify-content: space-between;
				gap: 2rem;
				padding: clamp(4.5rem, 10vw, 9rem) 0 clamp(2rem, 5vw, 4rem);
			}

			.intro-label,
			.shop-meta,
			.product-meta,
			.signup-kicker {
				font-size: 0.78rem;
				font-weight: 700;
				letter-spacing: 0.16em;
				text-transform: uppercase;
			}

			.intro-label {
				color: var(--muted);
			}

			.shop-title {
				max-width: 9ch;
				margin: 0.65rem 0 0;
				font-family: var(--display);
				font-size: clamp(4rem, 12vw, 11rem);
				font-weight: 400;
				letter-spacing: -0.04em;
				line-height: 0.82;
			}

			.shop-title span {
				color: var(--blue-light);
			}

			.shop-intro p {
				max-width: 24rem;
				margin: 0 0 0.45rem;
				color: var(--muted);
				font-size: clamp(1rem, 1.4vw, 1.12rem);
				line-height: 1.6;
			}

			.marquee-stage {
				position: relative;
				display: grid;
				gap: clamp(1rem, 2vw, 1.5rem);
				padding: clamp(1rem, 3vw, 2rem) 0 clamp(2rem, 5vw, 4rem);
				overflow: hidden;
				border-block: 1px solid var(--line);
			}

			.marquee-row {
				position: relative;
				width: 100%;
				overflow: visible;
			}

			.marquee-track {
				display: flex;
				width: max-content;
				will-change: transform;
			}

			.marquee-set {
				display: flex;
				gap: clamp(0.9rem, 2vw, 1.25rem);
				padding-right: clamp(0.9rem, 2vw, 1.25rem);
			}

			.product-card {
				position: relative;
				display: grid;
				width: clamp(14rem, 22vw, 24rem);
				color: var(--text);
				outline: none;
			}

			.product-frame {
				position: relative;
				aspect-ratio: 4 / 5;
				overflow: hidden;
				border: 1px solid var(--line);
				background:
					linear-gradient(135deg, rgba(24, 95, 165, 0.22), transparent 52%),
					var(--panel);
			}

			.product-frame img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				filter: grayscale(0.92) contrast(1.05);
				transform: scale(1);
				transition:
					filter 260ms ease,
					transform 260ms ease;
			}

			.product-card:hover .product-frame img,
			.product-card:focus-visible .product-frame img {
				filter: grayscale(0.08) contrast(1);
				transform: scale(1.05);
			}

			.product-info {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				min-height: 3.4rem;
				padding-top: 0.75rem;
				opacity: 0;
				transform: translateY(0.6rem);
				transition:
					opacity 200ms ease,
					transform 200ms ease;
			}

			.product-card:hover .product-info,
			.product-card:focus-visible .product-info {
				opacity: 1;
				transform: translateY(0);
			}

			.product-name {
				margin: 0;
				font-family: var(--display);
				font-size: clamp(1.15rem, 2vw, 2rem);
				font-weight: 400;
				letter-spacing: -0.02em;
				line-height: 1;
			}

			.product-price {
				color: var(--muted);
				white-space: nowrap;
			}

			.shop-meta {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				padding: clamp(1.25rem, 3vw, 2rem) 0 clamp(4rem, 9vw, 8rem);
				color: var(--muted);
			}

			.shop-all {
				color: var(--text);
			}

			.signup {
				display: grid;
				grid-template-columns: minmax(0, 0.95fr) minmax(20rem, 0.45fr);
				align-items: end;
				gap: clamp(2rem, 7vw, 7rem);
				min-height: 72svh;
				padding: clamp(4rem, 10vw, 8rem) 0 clamp(2rem, 6vw, 4rem);
				border-top: 1px solid var(--line);
			}

			.signup-kicker {
				color: var(--muted);
			}

			.signup h2 {
				max-width: 10ch;
				margin: 0.8rem 0 0;
				font-family: var(--display);
				font-size: clamp(3.5rem, 10vw, 9rem);
				font-weight: 400;
				letter-spacing: -0.04em;
				line-height: 0.84;
			}

			.signup h2 span {
				color: var(--blue-light);
			}

			.signup-form {
				display: grid;
				gap: 1rem;
			}

			.signup-form label {
				color: var(--muted);
				line-height: 1.6;
			}

			.form-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 0.65rem;
			}

			.form-row input,
			.form-row button {
				min-height: 3.25rem;
				border: 1px solid var(--line);
				border-radius: 0;
			}

			.form-row input {
				width: 100%;
				padding: 0 1rem;
				background: rgba(255, 255, 255, 0.04);
				color: var(--text);
			}

			.form-row input:focus {
				outline: 1px solid var(--blue-light);
				outline-offset: 2px;
			}

			.form-row button {
				padding: 0 1.2rem;
				background: var(--blue);
				color: var(--text);
				font-weight: 800;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				cursor: pointer;
				transition:
					background 180ms ease,
					transform 180ms ease;
			}

			.form-row button:hover,
			.form-row button:focus-visible {
				background: var(--blue-light);
				transform: translateY(-2px);
			}

			.signup-note {
				min-height: 1.4rem;
				margin: 0;
				color: var(--muted);
				font-size: 0.9rem;
			}

			body.is-reduced-motion .marquee-stage {
				overflow: visible;
			}

			body.is-reduced-motion .marquee-row {
				overflow: visible;
			}

			body.is-reduced-motion .marquee-track {
				width: auto;
				transform: none !important;
			}

			body.is-reduced-motion .marquee-set {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				width: min(1440px, calc(100% - clamp(2rem, 6vw, 5rem)));
				margin: 0 auto;
				padding-right: 0;
			}

			body.is-reduced-motion .marquee-set[aria-hidden="true"] {
				display: none;
			}

			body.is-reduced-motion .product-card {
				width: 100%;
			}

			body.is-reduced-motion .product-info {
				opacity: 1;
				transform: none;
			}

			@media (hover: none) {
				.product-info {
					opacity: 1;
					transform: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					scroll-behavior: auto !important;
					transition-duration: 0.01ms !important;
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
				}
			}

			@media (max-width: 900px) {
				.shop-intro,
				.signup {
					grid-template-columns: 1fr;
				}

				.shop-intro {
					align-items: flex-start;
					flex-direction: column;
				}

				body.is-reduced-motion .marquee-set {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}

			@media (max-width: 640px) {
				.nav-inner,
				.shop-intro,
				.shop-meta,
				.signup,
				body.is-reduced-motion .marquee-set {
					width: min(100% - 1.25rem, 1440px);
				}

				.nav-inner {
					align-items: flex-start;
					flex-direction: column;
					gap: 0.9rem;
				}

				.product-card {
					width: clamp(12rem, 66vw, 17rem);
				}

				body.is-reduced-motion .marquee-set {
					grid-template-columns: 1fr;
				}

				.shop-meta,
				.form-row {
					grid-template-columns: 1fr;
				}

				.form-row {
					display: grid;
				}
			}
		</style>
	</head>
	<body>
		<div class="page-transition" aria-hidden="true"></div>
		<div class="shop-page">
			<header class="shop-nav">
				<nav class="nav-inner" aria-label="Shop navigation">
					<a class="nav-brand" href="/index.html" aria-label="PHS DECA home">
						<img class="nav-mark" src="/images/logo.png" alt="PHS DECA logo" />
						<span>PHS DECA</span>
					</a>
					<div class="nav-links">
						<a class="nav-link" href="/index.html#about">About</a>
						<a class="nav-link" href="/index.html#work">Work</a>
						<a class="nav-link" href="/shop.html">Shop</a>
					</div>
				</nav>
			</header>

			<main>
				<section class="shop-intro" aria-labelledby="shop-title">
					<div>
						<div class="intro-label">Gear for the grind. <span data-item-count>0</span> items.</div>
						<h1 class="shop-title" id="shop-title">Chapter <span>shop.</span></h1>
					</div>
					<p>
						An ambient merch wall for future drops, chapter uniforms, conference gear,
						and fundraiser items. Swap the placeholder image and product data in the script.
					</p>
				</section>

				<section class="marquee-stage" aria-label="Featured shop items" data-marquee>
					<div class="marquee-row" data-row data-direction="-1"></div>
					<div class="marquee-row" data-row data-direction="1"></div>
				</section>

				<div class="shop-meta">
					<span>items (<span data-item-count>0</span>)</span>
					<a class="nav-link shop-all" href="#signup">Shop all</a>
				</div>

				<section class="signup" id="signup" aria-labelledby="signup-title">
					<div>
						<div class="signup-kicker">Drop alerts</div>
						<h2 id="signup-title">Get the next <span>release.</span></h2>
					</div>
					<form class="signup-form" data-signup-form>
						<label for="email">Join the list for merch windows, pickup details, and future product launches.</label>
						<div class="form-row">
							<input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
							<button type="submit">Sign up</button>
						</div>
						<p class="signup-note" data-signup-note></p>
					</form>
				</section>
			</main>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
		<script>
			/*
			 * Product customization:
			 * - Use one placeholder image for now, per request.
			 * - Later, replace image with each product photo path.
			 * - Update slug/name/price to point each card to its real product page.
			 */
			const placeholderImage = "/images/logo.png";
			const products = [
				{ slug: "ribbon-tee", name: "Ribbon tee", price: "$24", image: placeholderImage },
				{ slug: "chapter-hoodie", name: "Chapter hoodie", price: "$48", image: placeholderImage },
				{ slug: "state-crewneck", name: "State crewneck", price: "$42", image: placeholderImage },
				{ slug: "competition-tote", name: "Competition tote", price: "$18", image: placeholderImage },
				{ slug: "deca-cap", name: "DECA cap", price: "$22", image: placeholderImage },
				{ slug: "member-lanyard", name: "Member lanyard", price: "$10", image: placeholderImage },
			];

			const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
			const isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches;
			const marquee = document.querySelector("[data-marquee]");
			const rows = [...document.querySelectorAll("[data-row]")];
			const counts = document.querySelectorAll("[data-item-count]");
			const signupForm = document.querySelector("[data-signup-form]");
			const signupNote = document.querySelector("[data-signup-note]");
			const pageTransition = document.querySelector(".page-transition");

			counts.forEach((count) => {
				count.textContent = products.length;
			});

			const createProductCard = (product) => `
				<a class="product-card" href="/product/${product.slug}" aria-label="View ${product.name}">
					<div class="product-frame">
						<img src="${product.image}" alt="${product.name} placeholder product photo" loading="lazy" />
					</div>
					<div class="product-info">
						<h2 class="product-name">${product.name}</h2>
						<span class="product-meta product-price">${product.price}</span>
					</div>
				</a>
			`;

			const createSet = (hidden = false) => `
				<div class="marquee-set"${hidden ? ' aria-hidden="true"' : ""}>
					${products.map(createProductCard).join("")}
				</div>
			`;

			rows.forEach((row) => {
				row.innerHTML = `
					<div class="marquee-track">
						${createSet(false)}
						${createSet(true)}
					</div>
				`;
			});

			const productCards = [...document.querySelectorAll(".product-card")];

			const shouldUsePageTransition = (link, event) => {
				const href = link.getAttribute("href");

				if (
					!href ||
					href.startsWith("#") ||
					href.startsWith("mailto:") ||
					href.startsWith("tel:") ||
					link.target === "_blank" ||
					link.hasAttribute("download") ||
					event.defaultPrevented ||
					event.button !== 0 ||
					event.metaKey ||
					event.ctrlKey ||
					event.shiftKey ||
					event.altKey
				) {
					return null;
				}

				const url = new URL(href, window.location.href);
				const currentPath = window.location.pathname.replace(/\/$/, "");
				const targetPath = url.pathname.replace(/\/$/, "");
				const sameDocument =
					url.origin === window.location.origin &&
					targetPath === currentPath &&
					url.search === window.location.search;

				if (url.origin !== window.location.origin || url.href === window.location.href || (sameDocument && url.hash)) {
					return null;
				}

				return url;
			};

			document.querySelectorAll("a[href]").forEach((link) => {
				link.addEventListener("click", (event) => {
					const url = shouldUsePageTransition(link, event);
					if (!url) return;

					event.preventDefault();
					document.body.classList.add("is-transitioning");

					const navigate = () => {
						window.location.href = url.href;
					};

					if (prefersReducedMotion || !window.gsap) {
						pageTransition.style.transform = "translateY(0%)";
						window.setTimeout(navigate, 90);
						return;
					}

					gsap.to(pageTransition, {
						yPercent: 100,
						duration: 0,
					});
					gsap.to(pageTransition, {
						yPercent: 0,
						duration: 0.52,
						ease: "power3.inOut",
						onComplete: navigate,
					});
				});
			});

			if (prefersReducedMotion) {
				document.body.classList.add("is-reduced-motion");
			} else if (window.gsap) {
				const state = {
					speedScale: 1,
				};

				const rowStates = rows.map((row) => {
					const track = row.querySelector(".marquee-track");
					const firstSet = row.querySelector(".marquee-set");
					const direction = Number(row.dataset.direction || -1);
					const width = () => firstSet.getBoundingClientRect().width;

					return {
						direction,
						track,
						width,
						x: direction > 0 ? -width() : 0,
						setX: gsap.quickSetter(track, "x", "px"),
					};
				});

				const baseSpeed = isTouch ? 26 : 36;
				let lastTime = performance.now();

				const setSpeedScale = (value) => {
					gsap.to(state, {
						speedScale: value,
						duration: 0.28,
						ease: "power2.out",
						overwrite: true,
					});
				};

				const tick = () => {
					const now = performance.now();
					const deltaSeconds = Math.min((now - lastTime) / 1000, 0.05);
					lastTime = now;

					rowStates.forEach((row) => {
						const width = row.width();
						row.x += row.direction * baseSpeed * state.speedScale * deltaSeconds;

						if (row.direction < 0 && row.x <= -width) {
							row.x += width;
						}

						if (row.direction > 0 && row.x >= 0) {
							row.x -= width;
						}

						row.setX(row.x);
					});
				};

				gsap.ticker.add(tick);

				productCards.forEach((card) => {
					card.addEventListener("pointerenter", () => setSpeedScale(0.28));
					card.addEventListener("pointerleave", () => setSpeedScale(1));
				});

				marquee.addEventListener("pointerdown", () => setSpeedScale(0.12));
				window.addEventListener("pointerup", () => setSpeedScale(1));

				window.addEventListener("resize", () => {
					rowStates.forEach((row) => {
						const width = row.width();
						row.x = row.direction > 0 ? -width : 0;
						row.setX(row.x);
					});
				});

				gsap.from(".shop-intro > *, .shop-meta, .signup > *", {
					opacity: 0,
					y: 34,
					duration: 0.7,
					ease: "power3.out",
					stagger: 0.08,
				});

				gsap.from(".marquee-row", {
					opacity: 0,
					y: 28,
					duration: 0.72,
					ease: "power3.out",
					stagger: 0.12,
					delay: 0.16,
				});
			}

			signupForm.addEventListener("submit", (event) => {
				event.preventDefault();
				signupNote.textContent = "You're on the placeholder list.";
				signupForm.reset();
			});
		</script>
	</body>
</html>
